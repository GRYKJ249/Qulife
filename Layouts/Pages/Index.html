acity:1;transform:none;animation:none;z-index:1}\n  .progress{margin:4px 0 2px}\n  .progress-label{letter-spacing:normal}\n  /* Keep signup actions in the flow so they never cover field help or counters. */\n  .page{padding-bottom:28px !important}\n  .page .step .next-btn{position:static;inset:auto;left:auto;bottom:auto;z-index:1;width:100%;max-width:none;margin:14px 0 2px;padding:15px 20px;opacity:1;transform:none;animation:none;box-shadow:0 10px 22px var(--accent-shadow),0 0 0 4px rgba(255,255,255,.68)}\n  .page .step .next-btn:disabled{opacity:.52;cursor:not-allowed}\n  .page .step .next-btn:hover{transform:translateY(-1px)}\n  .page .step .next-btn:active{transform:scale(.985)}\n  html[dir=\"rtl\"] .page .step .next-btn svg,html[dir=\"rtl\"] .page .step .back img{transform:rotate(180deg)}\n  @media(max-width:520px){.page{padding-left:16px;padding-right:16px;padding-bottom:calc(24px + env(safe-area-inset-bottom)) !important}.page .step .page-top{min-height:60px;gap:9px;padding:10px 12px}.page .step .page-top h2{font-size:19px}.page .step .page-top p{font-size:12.5px}.anim-stage{min-height:180px}.page .step .next-btn{min-height:54px;margin-top:12px}}\n  .email-analysis{display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px;margin:0 0 10px;padding:11px 13px;border:1px solid #DBEAFE;border-radius:15px;background:#F7FAFF;color:#475569;font-size:12px;line-height:1.5;direction:inherit}\n  .email-analysis-mark{width:9px;height:9px;flex:0 0 9px;margin-top:4px;border-radius:50%;background:#3B82F6}\n  .email-analysis-text{flex:1;min-width:180px}\n  .email-analysis button{margin-inline-start:auto;padding:7px 11px;border:1px solid #FFE0EC;border-radius:99px;background:#FFF5F8;color:#D6155F;font-size:11px;font-weight:800;cursor:pointer}\n  .email-analysis button[hidden]{display:none!important}\n  .email-analysis.is-good{border-color:#BBF7D0;background:#F0FDF4;color:#166534}.email-analysis.is-good .email-analysis-mark{background:#16A34A}\n  .email-analysis.is-warning{border-color:#FDE68A;background:#FFFBEB;color:#92400E}.email-analysis.is-warning .email-analysis-mark{background:#F59E0B}\n  .email-analysis.is-error{border-color:#FECACA;background:#FEF2F2;color:#B91C1C}.email-analysis.is-error .email-analysis-mark{background:#EF4444}\n\u003c/style\u003e\n\u003cscript src=\"../Javascript/js/nav.js\"\u003e\u003c/script\u003e\n\u003cscript src=\"../Javascript/js/theme-engine.js\"\u003e\u003c/script\u003e\n\u003cscript src=\"../Javascript/auth-client.js\"\u003e\u003c/script\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n  \u003cdiv class=\"page\"\u003e\n\n    \u003c!-- STEP 1 : NAME --\u003e\n    \u003cdiv class=\"step active\" id=\"step1\"\u003e\n      \u003cdiv class=\"page-top\"\u003e\n        \u003cbutton class=\"back\" onclick=\"qulifeBack()\" aria-label=\"Back\"\u003e\u003cimg src=\"../../Pictures/SVG/Themes/icon-40fb42.svg\" alt=\"\"\u003e\u003c/button\u003e\n        \u003cdiv class=\"title-ico\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\"\u003e\u003ccircle cx=\"12\" cy=\"8\" r=\"4\" stroke=\"#FF2E7E\" stroke-width=\"2\"/\u003e\u003cpath d=\"M4 21C4 16.5 7.5 13.5 12 13.5C16.5 13.5 20 16.5 20 21\" stroke=\"#FF2E7E\" stroke-width=\"2\" stroke-linecap=\"round\"/\u003e\u003c/svg\u003e\u003c/div\u003e\n        \u003cdiv\u003e\u003ch2\u003eYour Name\u003c/h2\u003e\u003cp\u003eEnter your name to continue\u003c/p\u003e\u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"progress\" data-label=\"Your Name\"\u003e\u003c/div\u003e\u003cdiv class=\"progress-label\"\u003eStep 1 of 8 - Your Name\u003c/div\u003e\n      \u003cdiv class=\"anim-stage\" id=\"heroStage\" onclick=\"onHeroClick(this)\"\u003e\u003cdiv id=\"stage\" style=\"display:flex;align-items:center;justify-content:center;width:100%\"\u003e\n        \u003csvg width=\"200\" height=\"200\" viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"\u003e\u003cdefs\u003e\u003clinearGradient id=\"mix-lock\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\"\u003e\u003cstop offset=\"0%\" stop-color=\"#2563EB\" /\u003e\u003cstop offset=\"50%\" stop-color=\"#EF4444\" /\u003e\u003cstop offset=\"100%\" stop-color=\"#FACC15\" /\u003e\u003c/linearGradient\u003e\u003c/defs\u003e\u003cg transform=\"translate(100 100) scale(0.85) translate(-100 -100)\"\u003e\u003cpath d=\"M82 96 V78 A18 18 0 0 1 118 78 V96\" fill=\"none\" stroke=\"url(#mix-lock)\" stroke-width=\"10\" stroke-linecap=\"round\" /\u003e\u003crect x=\"56\" y=\"94\" width=\"88\" height=\"78\" rx=\"16\" fill=\"url(#mix-lock)\" /\u003e\u003ccircle cx=\"100\" cy=\"124\" r=\"12\" fill=\"#FFFFFF\" /\u003e\u003crect x=\"96\" y=\"124\" width=\"8\" height=\"18\" rx=\"4\" fill=\"#FFFFFF\" /\u003e\u003c/g\u003e\u003c/svg\u003e\n      \u003c/div\u003e\u003csmall\u003eWatch the icons\u003c/small\u003e\u003c/div\u003e\n      \u003cdiv class=\"name-row\"\u003e\n        \u003cdiv class=\"name-field\"\u003e\n          \u003clabel for=\"firstName\"\u003eFirst Name\u003c/label\u003e\n          \u003cdiv class=\"name-box\" id=\"boxFirst\"\u003e\u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\"\u003e\u003ccircle cx=\"12\" cy=\"8\" r=\"4\" stroke=\"#111827\" stroke-width=\"1.8\" /\u003e\u003cpath d=\"M4 21C4 16.5 7.5 13.5 12 13.5C16.5 13.5 20 16.5 20 21\" stroke=\"#111827\" stroke-width=\"1.8\" stroke-linecap=\"round\" /\u003e\u003c/svg\u003e\u003cinput id=\"firstName\" type=\"text\" placeholder=\"First Name\" autocomplete=\"given-name\" maxlength=\"30\" oninput=\"validateName()\" onpaste=\"return blockBadPaste(event)\" /\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"name-field\"\u003e\n          \u003clabel for=\"lastName\"\u003eLast Name\u003c/label\u003e\n          \u003cdiv class=\"name-box\" id=\"boxLast\"\u003e\u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\"\u003e\u003ccircle cx=\"12\" cy=\"8\" r=\"4\" stroke=\"#111827\" stroke-width=\"1.8\" /\u003e\u003cpath d=\"M4 21C4 16.5 7.5 13.5 12 13.5C16.5 13.5 20 16.5 20 21\" stroke=\"#111827\" stroke-width=\"1.8\" stroke-linecap=\"round\" /\u003e\u003c/svg\u003e\u003cinput id=\"lastName\" type=\"text\" placeholder=\"Last Name\" autocomplete=\"family-name\" maxlength=\"30\" oninput=\"validateName()\" onpaste=\"return blockBadPaste(event)\" /\u003e\u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"info-big pink\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\"\u003e\u003ccircle cx=\"12\" cy=\"8\" r=\"4\" stroke=\"#FF2E7E\" stroke-width=\"2\"/\u003e\u003cpath d=\"M4 21C4 16.5 7.5 13.5 12 13.5C16.5 13.5 20 16.5 20 21\" stroke=\"#FF2E7E\" stroke-width=\"2\" stroke-linecap=\"round\"/\u003e\u003c/svg\u003e\u003cp\u003e\u003cb\u003eYour real name\u003c/b\u003eThis is how friends will find you on Qulife. Use your real first name, letters only, no numbers or symbols.\u003c/p\u003e\u003c/div\u003e\n      \u003cdiv class=\"info-big blue\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\" stroke=\"#2563EB\" stroke-width=\"2\"/\u003e\u003cpath d=\"M12 8v5M12 16v.5\" stroke=\"#2563EB\" stroke-width=\"2\" stroke-linecap=\"round\"/\u003e\u003c/svg\u003e\u003cp\u003e\u003cb\u003eWhy two names?\u003c/b\u003eOne name is not enough. Your last name keeps your account unique and helps people trust your profile.\u003c/p\u003e\u003c/div\u003e\n      \u003cdiv class=\"counter\"\u003e\u003cspan id=\"nameCount\"\u003e0 / 30\u003c/span\u003e characters\u003c/div\u003e\n      \u003cdiv class=\"err\" id=\"errName\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\" stroke=\"#EF4444\" stroke-width=\"2\"/\u003e\u003cpath d=\"M12 8v5M12 16v.5\" stroke=\"#EF4444\" stroke-width=\"2\" stroke-linecap=\"round\"/\u003e\u003c/svg\u003ePlease enter both First Name and Last Name - one name is not enough.\u003c/div\u003e\n      \u003cbutton class=\"apply next-btn\" id=\"next1\" disabled onclick=\"tryNext(1)\"\u003eNext \u003csvg viewBox=\"0 0 24 24\" fill=\"none\"\u003e\u003cpath d=\"M5 12h14M13 6l6 6-6 6\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/\u003e\u003c/svg\u003e\u003c/button\u003e\n    \u003c/div\u003e\n\n    \u003c!-- STEP 2 : PASSWORD --\u003e\n    \u003cdiv class=\"step\" id=\"step2\"\u003e\n      \u003cdiv class=\"page-top\"\u003e\n        \u003cbutton class=\"back\" onclick=\"goStep(1)\" aria-label=\"Back\"\u003e\u003cimg src=\"../../Pictures/SVG/Themes/icon-40fb42.svg\" alt=\"\"\u003e\u003c/button\u003e\n        \u003cdiv class=\"title-ico\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\"\u003e\u003crect x=\"5\" y=\"11\" width=\"14\" height=\"10\" rx=\"3\" stroke=\"#FF2E7E\" stroke-width=\"2\"/\u003e\u003cpath d=\"M8 11V8a4 4 0 0 1 8 0v3\" stroke=\"#FF2E7E\" stroke-width=\"2\" stroke-linecap=\"round\"/\u003e\u003c/svg\u003e\u003c/div\u003e\n        \u003cdiv\u003e\u003ch2\u003ePassword\u003c/h2\u003e\u003cp\u003eOne strong password keeps you safe\u003c/p\u003e\u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"progress\" data-label=\"Password\"\u003e\u003c/div\u003e\u003cdiv class=\"progress-label\"\u003eStep 2 of 8 - Password\u003c/div\u003e\n      \u003cdiv class=\"anim-stage\" id=\"keyStageWrap\" onclick=\"keyToLock(this)\"\u003e\n        \u003cdiv id=\"keyStage\" class=\"keylock-stage\"\u003e\n          \u003csvg width=\"200\" height=\"200\" viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"\u003e\u003cdefs\u003e\u003clinearGradient id=\"mix-key\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\"\u003e\u003cstop offset=\"0%\" stop-color=\"#2563EB\" /\u003e\u003cstop offset=\"50%\" stop-color=\"#EF4444\" /\u003e\u003cstop offset=\"100%\" stop-color=\"#FACC15\" /\u003e\u003c/linearGradient\u003e\u003c/defs\u003e\u003cg\u003e\u003ccircle cx=\"78\" cy=\"78\" r=\"34\" fill=\"none\" stroke=\"url(#mix-key)\" stroke-width=\"12\" /\u003e\u003ccircle cx=\"78\" cy=\"78\" r=\"12\" fill=\"url(#mix-key)\" /\u003e\u003cpath d=\"M102 102 L158 158\" stroke=\"url(#mix-key)\" stroke-width=\"12\" stroke-linecap=\"round\" /\u003e\u003cpath d=\"M128 128 L156 128 L156 156\" fill=\"none\" stroke=\"url(#mix-key)\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-linejoin=\"round\" /\u003e\u003c/g\u003e\u003c/svg\u003e\n        \u003c/div\u003e\n        \u003csmall\u003eTap the key - it will open the lock\u003c/small\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"pass-card\"\u003e\n        \u003ch3\u003eCreate your password\u003c/h3\u003e\n        \u003cp\u003eMake it long, private and easy for you only. Never share it with anyone.\u003c/p\u003e\n        \u003cdiv class=\"stack\" style=\"margin:0\"\u003e\n          \u003cdiv class=\"name-field\"\u003e\n            \u003clabel for=\"password\"\u003ePassword\u003c/label\u003e\n            \u003cdiv class=\"name-box tall\" id=\"boxPass\"\u003e\u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\"\u003e\u003crect x=\"5\" y=\"11\" width=\"14\" height=\"10\" rx=\"3\" stroke=\"#111827\" stroke-width=\"1.8\" /\u003e\u003cpath d=\"M8 11V8a4 4 0 0 1 8 0v3\" stroke=\"#111827\" stroke-width=\"1.8\" stroke-linecap=\"round\" /\u003e\u003c/svg\u003e\u003cinput id=\"password\" type=\"password\" placeholder=\"Enter password\" autocomplete=\"new-password\" maxlength=\"64\" oninput=\"checkPassword()\" /\u003e\u003cbutton class=\"eye\" type=\"button\" onclick=\"togglePass('password',this)\"\u003e\u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\"\u003e\u003cpath d=\"M2 12S5.5 5 12 5s10 7 10 7-3.5 7-10 7S2 12 2 12Z\" stroke=\"#111827\" stroke-width=\"1.8\" /\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"3\" stroke=\"#111827\" stroke-width=\"1.8\" /\u003e\u003c/svg\u003e\u003c/button\u003e\u003c/div\u003e\n            \u003cdiv class=\"tools\"\u003e\u003cbutton class=\"chip\" type=\"button\" onclick=\"generatePassword()\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\"\u003e\u003cpath d=\"M4 12a8 8 0 1 1 2.3 5.6M4 12V8m0 4h4\" stroke=\"#FF2E7E\ \n  function toggleAllPass(){\n    const a=document.getElementById('password'), b=document.getElementById('confirmPassword');\n    const toText = a.type==='password';\n    a.type=toText?'text':'password'; b.type=toText?'text':'password';\n  }\n  function generatePassword(){\n    const chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%';\n    let p=''; const arr=new Uint32Array(14); crypto.getRandomValues(arr);\n    arr.forEach(n=\u003ep+=chars[n%chars.length]);\n    if(!/\\d/.test(p)) p=p.slice(0,-1)+'7';\n    if(!/[A-Z]/.test(p)) p='A'+p.slice(1);\n    document.getElementById('password').value=p; document.getElementById('confirmPassword').value=p; checkPassword();\n  }\n  async function copyPassword(){\n    const p=document.getElementById('password').value; if(!p) return;\n    try{ await navigator.clipboard.writeText(p); document.getElementById('copyLabel').textContent='Copied!'; setTimeout(()=\u003edocument.getElementById('copyLabel').textContent='Copy',1200); }catch(e){}\n  }\n  function checkPassword(){\n    if(Date.now()\u003clockUntil){ document.getElementById('lockNote').classList.add('show'); return false; }\n    const p = document.getElementById('password').value;\n    const c = document.getElementById('confirmPassword').value;\n    if(/\\s/.test(p) || /\u003c|\u003e|script/i.test(p+c)){ document.getElementById('password').value=''; document.getElementById('confirmPassword').value=''; }\n    const pp = document.getElementById('password').value, cc = document.getElementById('confirmPassword').value;\n    const len = pp.length \u003e= 8, num = /\\d/.test(pp), up = /[A-Z]/.test(pp), sym = !/\\s/.test(pp) \u0026\u0026 !/[\u003c\u003e]/.test(pp), match = pp \u0026\u0026 pp === cc, notName = signup.firstName ? !pp.toLowerCase().includes(signup.firstName.toLowerCase()) : true, hasSym = /[!@#$%^\u0026*]/.test(pp);\n    document.getElementById('rLen').className = len ? 'ok' : '';\n    document.getElementById('rNum').className = num ? 'ok' : '';\n    document.getElementById('rUp').className = up ? 'ok' : '';\n    document.getElementById('rSym').className = sym ? 'ok' : '';\n    document.getElementById('rMatch').className = match ? 'ok' : '';\n    const score = [len,num,up,match,hasSym].filter(Boolean).length;\n    const labels=['-','Weak','Fair','Good','Strong','Very Strong'];\n    document.getElementById('strengthLabel').textContent='Strength: '+labels[Math.min(score,5)];\n    ['s1','s2','s3','s4'].forEach((id,i)=\u003e{ const el=document.getElementById(id); el.classList.toggle('on', i \u003c Math.min(4,score)); el.classList.toggle('green', score\u003e=4); });\n    const ok = len \u0026\u0026 num \u0026\u0026 up \u0026\u0026 sym \u0026\u0026 match \u0026\u0026 notName;\n    document.getElementById('next2').disabled = !ok;\n    document.getElementById('boxPass').classList.toggle('valid', ok);\n    showErr('errPass', false);\n    return ok;\n  }\n  function normalizeEmailDomain(domain){\n    const unicodeDomain=String(domain||'').normalize('NFC').toLowerCase();\n    if(!unicodeDomain || !/^[\\p{L}\\p{N}\\p{M}.-]+$/u.test(unicodeDomain) || unicodeDomain.includes('..')) return '';\n    let asciiDomain='';\n    try{ asciiDomain=new URL('http://'+unicodeDomain).hostname.toLowerCase(); }catch(e){ return ''; }\n    if(!asciiDomain || asciiDomain.length\u003e253 || asciiDomain.startsWith('.') || asciiDomain.endsWith('.') || asciiDomain.includes('..')) return '';\n    const labels=asciiDomain.split('.');\n    if(labels.length\u003c2 || labels.some(function(label){ return !label || label.length\u003e63 || !/^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$/.test(label); })) return '';\n    const tld=labels[labels.length-1];\n    if(!/^(?:[a-z]{2,63}|xn--[a-z0-9-]{2,59})$/.test(tld)) return '';\n    return asciiDomain;\n  }\n  function emailLocalRisk(local){\n    const base=String(local||'').split('+')[0].toLowerCase();\n    const flat=base.replace(/[._-]/g,'');\n    if(BLOCKED_EMAIL_LOCALS.has(flat) || /^(?:test|demo|sample|example|fake|temp)\\d*$/.test(flat)) return 'placeholder';\n    const nameTokens=[signup.firstName,signup.lastName].map(function(name){ return String(name||'').toLowerCase().replace(/[^a-z0-9]/g,''); }).filter(function(name){ return name.length\u003e=3; });\n    const matchesProfile=nameTokens.some(function(name){ return flat.includes(name); });\n    if(ROLE_EMAIL_LOCALS.has(flat)) return 'unusual';\n    if(/^(?:qwerty|asdf|zxcv|abc123|123456|password)/.test(flat) || /(.)\\1{3,}/.test(flat)) return 'unusual';\n    if(flat.length\u003e=12 \u0026\u0026 /[0-9]/.test(flat) \u0026\u0026 /[a-z]/.test(flat) \u0026\u0026 !matchesProfile \u0026\u0026 !/[._-]/.test(base)) return 'unusual';\n    return '';\n  }\n  function analyzeEmail(value){\n    const raw=String(value||'').trim().toLowerCase();\n    if(!raw) return {accepted:false,state:'neutral',message:'Enter an email to analyze.'};\n    if(raw.length\u003e254) return {accepted:false,state:'error',message:'Check the format: name@provider.com, with no spaces or repeated dots.'};\n    const at=raw.indexOf('@');\n    if(at\u003c0) return {accepted:false,state:'neutral',message:'Keep typing to complete the email address.'};\n    if(at===raw.length-1) return {accepted:false,state:'neutral',message:'Enter a domain after the @ sign.'};\n    if(at===0 || at!==raw.lastIndexOf('@')) return {accepted:false,state:'error',message:'Check the format: name@provider.com, with no spaces or repeated dots.'};\n    const local=raw.slice(0,at), rawDomain=raw.slice(at+1);\n    if(local.length\u003e64 || !EMAIL_LOCAL_PATTERN.test(local)) return {accepted:false,state:'error',message:'Check the format: name@provider.com, with no spaces or repeated dots.'};\n    const domain=normalizeEmailDomain(rawDomain);\n    if(!domain){\n      if(!rawDomain.includes('.')) return {accepted:false,state:'neutral',message:'Keep typing to complete the email address.'};\n      return {accepted:false,state:'error',message:'Check the format: name@provider.com, with no spaces or repeated dots.'};\n    }\n    const normalized=local+'@'+domain;\n    if(normalized.length\u003e254) return {accepted:false,state:'error',message:'Check the format: name@provider.com, with no spaces or repeated dots.'};\n    const isDisposable=Array.from(DISPOSABLE_EMAIL_DOMAINS).some(function(item){ return domain===item || domain.endsWith('.'+item); });\n    if(isDisposable) return {accepted:false,state:'error',message:'Disposable email addresses are not accepted.',normalized:normalized};\n    if(TEST_EMAIL_DOMAINS.has(domain)) return {accepted:false,state:'error',message:'This looks like a test or placeholder address. Use an inbox you control.',normalized:normalized};\n    const suggestion=EMAIL_DOMAIN_TYPO_SUGGESTIONS[domain];\n    if(suggestion) return {accepted:false,state:'warning',message:'Possible provider typo detected. Review the suggested domain.',normalized:normalized,suggestion:suggestion};\n    const provider=EMAIL_PROVIDER_BY_DOMAIN[domain];\n    if(!provider) return {accepted:false,state:'error',message:'This email provider is not supported.',normalized:normalized};\n    const risk=emailLocalRisk(local);\n    if(risk==='placeholder') return {accepted:false,state:'error',message:'This looks like a test or placeholder address. Use an inbox you control.',normalized:normalized,provider:provider};\n    if(risk==='unusual') return {accepted:true,state:'warning',message:'This address has an unusual pattern. Double-check it before continuing.',normalized:normalized,provider:provider};\n    return {accepted:true,state:'good',message:'Format and provider look good. Inbox ownership is not verified yet.',normalized:normalized,provider:provider};\n  }\n  function isBlockedEmail(value){ return !analyzeEmail(value).accepted; }\n  function emailCopy(message){\n    const copy=window.QulifeSignupCopy;\n    const lang=window.QulifeI18n ? window.QulifeI18n.lang : 'en';\n    return copy ? copy.translate(message,lang) : message;\n  }\n  function updateEmailAnalysis(result){\n    latestEmailAnalysis=result;\n    const panel=document.getElementById('emailAnalysis');\n    const text=document.getElementById('emailAnalysisText');\n    const fix=document.getElementById('emailFix');\n    const errorText=document.getElementById('errEmailText');\n    if(panel){\n      ['is-neutral','is-good','is-warning','is-error'].forEach(function(className){ panel.classList.remove(className); });\n      panel.classList.add('is-'+result.state);\n    }\n    if(text) text.textContent=emailCopy(result.message);\n    if(fix){\n      fix.hidden=!result.suggestion;\n      if(result.suggestion){ fix.dataset.domain=result.suggestion; fix.textContent=emailCopy('Use suggested domain')+' '+result.suggestion; }\n      else delete fix.dataset.domain;\n    }\n    if(errorText) errorText.textContent=emailCopy(result.accepted ? 'Please enter a valid email address.' : result.message);\n  }\n  window.addEventListener('qulife-lang',function(){ if(latestEmailAnalysis) updateEmailAnalysis(latestEmailAnalysis); });\n  function validateEmail(){\n    const input=document.getElementById('email');\n    const value=String(input.value||'').trim().toLowerCase();\n    input.value=value;\n    const result=analyzeEmail(value);\n    if(result.normalized) input.value=result.normalized;\n    updateEmailAnalysis(result);\n    const ok=result.accepted;\n    document.getElementById('next3').disabled=!ok;\n    document.getElementById('boxEmail').classList.toggle('error',value.length\u003e0 \u0026\u0026 !ok);\n    document.getElementById('boxEmail').classList.toggle('valid',ok);\n    showErr('errEmail',false);\n    signup.email=ok ? result.normalized : '';\n    return ok;\n  }\n  function clearEmail(){ document.getElementById('email').value=''; validateEmail(); }\n  function useSuggestion(domain){\n    const input=document.getElementById('email');\n    const raw=String(input.value||'').trim().split('@')[0].toLowerCase();\n    if(!raw){ updateEmailAnalysis(analyzeEmail('')); return; }\n    input.value=raw+'@'+domain;\n    validateEmail();\n  }\n  function applyEmailDomainSuggestion(){\n    const input=document.getElementById('email');\n    const fix=document.getElementById('emailFix');\n    const domain=fix \u0026\u0026 fix.dataset.domain;\n    const value=String(input.value||'').trim();\n    const at=value.lastIndexOf('@');\n    if(!domain || at\u003c=0) return;\n    input.value=value.slice(0,at+1)+domain;\n    validateEmail();\n    input.focus();\n  }\n  function validateUsername(){\n    let v=document.getElementById('username').value.toLowerCase().replace(/[^a-z0-9_]/g,'').replace(/^_+/,'').slice(0,20);\n    document.getElementById('username').value=v;\n    const okLen = /^[a-z][a-z0-9_]{2,19}$/.test(v);\n    const notTaken = !TAKEN_USERNAMES.includes(v);\n    document.getElementById('rUserLen').className = okLen ? 'ok' : '';\n    document.getElementById('rUserAvail').className = okLen \u0026\u0026 notTaken ? 'ok' : '';\n    const ok = okLen \u0026\u0026 notTaken;\n    document.getElementById('next4').disabled = !ok;\n    document.getElementById('boxUser').classList.toggle('error', v.length\u003e0 \u0026\u0026 !ok);\n    document.getElementById('boxUser').classList.toggle('valid', ok);\n    showErr('errUser', false);\n    if(ok) signup.username=v;\n    return ok;\n  }\n  function suggestUsername(){\n    const base=(signup.firstName||'').toLowerCase().replace(/[^a-z]/g,'')||'';\n    if(!base) return;\n    let cand=base+'_'+Math.floor(100+Math.random()*900);\n    let tries=0;\n    while(TAKEN_USERNAMES.includes(cand) \u0026\u0026 tries\u003c10){ cand=base+'_'+Math.floor(100+Math.random()*900); tries++; }\n    document.getElementById('username').value=cand; validateUsername();\n  }\n  function onProfileChange(e){\n    const file = e.target.files \u0026\u0026 e.target.files[0];\n    if(!file) return;\n    if(!file.type.startsWith('image/')){ e.target.value=''; showErr('errProfile', true); return; }\n    if(file.size \u003e 5*1024*1024){ e.target.value=''; document.getElementById('errProfile').textContent='Image is too large - max 5MB.'; showErr('errProfile', true); return; }\n    const url = URL.createObjectURL(file);\n    const img=document.getElementById('profilePreview');\n    img.onload=()=\u003e{ URL.revokeObjectURL(url); };\n    img.src = url;\n    document.getElementById('profileCircle').classList.add('has-img');\n    profileDone = true; profileSkipped=false;\n    document.getElementById('next5').disabled = false;\n    showErr('errProfile', false);\n  }\n  function removeProfile(){\n    document.getElementById('profileInput').value='';\n    document.getElementById('profilePreview').src='';\n    document.getElementById('profileCircle').classList.remove('has-img');\n    profileDone=false; profileSkipped=false; document.getElementById('next5').disabled=true;\n  }\n  function skipProfile(){\n    profileSkipped=true; profileDone=false;\n    document.getElementById('profileInput').value='';\n    document.getElementById('profilePreview').src='';\n    document.getElementById('profileCircle').classList.remove('has-img');\n    document.getElementById('next5').disabled=false; showErr('errProfile', false);\n    goStep(6);\n  }\n  function initBirthdaySelects(){\n    const d=document.getElementById('birthDay'), y=document.getElementById('birthYear');\n    if(!d || d.options.length\u003e1) return;\n    for(let i=1;i\u003c=31;i++){ const o=document.createElement('option'); o.value=String(i).padStart(2,'0'); o.textContent=i; d.appendChild(o); }\n    const now=new Date().getFullYear();\n    for(let yr=now-13; yr\u003e=now-100; yr--){ const o=document.createElement('option'); o.value=String(yr); o.textContent=yr; y.appendChild(o); }\n  }\n  function syncBirthdayHidden(){\n    const dd=document.getElementById('birthDay').value, mm=document.getElementById('birthMonth').value, yy=document.getElementById('birthYear').value;\n    document.getElementById('birthday').value = (dd \u0026\u0026 mm \u0026\u0026 yy) ? yy+'-'+mm+'-'+dd : '';\n  }\n  function calcAge(){\n    syncBirthdayHidden();\n    const v=document.getElementById('birthday').value; if(!v) return null;\n    const b=new Date(v+'T00:00:00'), now=new Date();\n    if(isNaN(b.getTime()) || b\u003enow) return -1;\n    let age=now.getFullYear()-b.getFullYear();\n    const m=now.getMonth()-b.getMonth();\n    if(m\u003c0 || (m===0 \u0026\u0026 now.getDate()\u003cb.getDate())) age--;\n    return age;\n  }\n  function validateBirthday(){\n    const age=calcAge();\n    const ok = age!==null \u0026\u0026 age\u003e=13 \u0026\u0026 age\u003c=120 \u0026\u0026 !!signup.gender;\n    document.getElementById('ageText').textContent = age===null ? 'Choose Day, Month and Year' : age\u003c0 ? 'Birthday cannot be in the future' : age\u003c13 ? 'You are '+age+' - must be 13 or older' : 'You are '+age+' years old';\n    document.getElementById('rAge').className = age!==null \u0026\u0026 age\u003e=13 ? 'ok' : '';\n    document.getElementById('next6').disabled = !ok;\n    document.getElementById('boxBirth') \u0026\u0026 document.getElementById('boxBirth').classList.toggle('error', age!==null \u0026\u0026 age\u003c13);\n    showErr('errBirth', false);\n    if(age!==null \u0026\u0026 age\u003e=13) signup.birthday=document.getElementById('birthday').value;\n    return ok;\n  }\n  function pickGender(btn){\n    document.querySelectorAll('#genderTools .chip').forEach(c=\u003ec.classList.remove('active'));\n    btn.classList.add('active'); signup.gender=btn.dataset.gender; validateBirthday();\n  }\n  async function addFingerprint(){\n    if(unlockMethod==='password'){ document.getElementById('next7').disabled=false; goStep(8); return; }\n    if(unlockMethod==='pattern'){\n      document.getElementById('fingerText').textContent='Pattern unlock is not connected to the server yet. Choose Passkey or Password for a real account credential.';\n      document.querySelector('[data-unlock=\"password\"]').click();\n      return;\n    }\n    const btn = document.getElementById('fingerBtn'); if(btn.disabled) return;\n    btn.disabled=true; btn.textContent='Waiting for your device...';\n    try{\n      const profile={ firstName:signup.firstName, lastName:signup.lastName, email:signup.email, username:signup.username, password:document.getElementById('password').value||'', birthday:signup.birthday, gender:signup.gender };\n      const result=await window.QulifeAuth.registerPasskey(profile);\n      fingerDone=true; fingerSkipped=false; signup.authUser=result.user;\n      document.getElementById('fingerCircle').classList.add('done');\n      document.getElementById('fingerTitle').textContent='Passkey added securely';\n      document.getElementById('fingerText').textContent='Your device verified you. Qulife stored only a public key, never your fingerprint or Face ID data.';\n      btn.textContent='Passkey Added'; document.getElementById('next7').disabled=false;\n    }catch(err){\n      fingerDone=false; btn.disabled=false; btn.textContent='Set up Passkey';\n      document.getElementById('fingerText').textContent=err?.message || 'Passkey setup was cancelled or unavailable. Try again, or choose Password.';\n    }\n  }\n  function skipFingerprint(){ fingerSkipped=true; fingerDone=false; document.getElementById('next7').disabled=false; document.getElementById('fingerText').textContent='Skipped - you can add unlock later from Settings.'; }\n  async function requestMedia(){\n    const btn = document.getElementById('permBtn'); if(btn.disabled) return; btn.disabled=true; btn.textContent='Requesting...';\n    try{ if(navigator.mediaDevices \u0026\u0026 navigator.mediaDevices.getUserMedia){ const s=await navigator.mediaDevices.getUserMedia({video:true,audio:true}); s.getTracks().forEach(t=\u003et.stop()); } }catch(e){}\n    permDone = true; btn.textContent='Access Allowed';\n    ['permPhoto','permVideo','permSong'].forEach(id=\u003edocument.getElementById(id).classList.add('allowed'));\n    ['statusPhoto','statusVideo','statusSong'].forEach(id=\u003edocument.getElementById(id).textContent='Allowed');\n    document.getElementById('next8').disabled=false;\n  }\n  function tryNext(n){\n    if(locked) return;\n    if(Date.now()\u003clockUntil){ document.getElementById('lockNote').classList.add('show'); return; }\n    let ok=true;\n    if(n===1) ok=validateName();\n    if(n===2) ok=checkPassword();\n    if(n===3) ok=validateEmail();\n    if(n===4) ok=validateUsername();\n    if(n===5) ok=profileDone||profileSkipped;\n    if(n===6) ok=validateBirthday();\n    if(n===7) ok=(unlockMethod==='password') || fingerDone || fingerSkipped;\n    if(n===8) ok=permDone;\n    if(!ok){\n      failedAttempts++;\n      if(n===1) showErr('errName', true);\n      if(n===2) showErr('errPass', true);\n      if(n===3) showErr('errEmail', true);\n      if(n===4) showErr('errUser', true);\n      if(n===5) showErr('errProfile', true);\n      if(n===6) showErr('errBirth', true);\n      if(n===7) document.getElementById('fingerText').textContent='Please set up a passkey, choose Password, or skip for now.';\n      if(failedAttempts\u003e=5){ lockUntil=Date.now()+30000; document.getElementById('lockNote').classList.add('show'); setTimeout(()=\u003edocument.getElementById('lockNote').classList.remove('show'),30000); failedAttempts=0; }\n      return;\n    }\n    failedAttempts=0;\n    if(n===8){ finishSignup(); return; }\n    goStep(n+1);\n  }\n  async function finishSignup(){\n    if(!validateName() || !validateEmail() || !validateUsername() || !(profileDone||profileSkipped) || !permDone) return;\n    if(isBlockedEmail(signup.email)){ showErr('errEmail', true); goStep(3); return; }\n    const btn=document.getElementById('next8'); btn.disabled=true; btn.textContent='Creating your secure account...';\n    const profile={ firstName:signup.firstName, lastName:signup.lastName, email:signup.email, username:signup.username, password:document.getElementById('password').value||'', birthday:signup.birthday, gender:signup.gender };\n    try{\n      const result=(
