<!-- مسجد بيأذن: نجوم تلمع + موجات صوت من المآذن + هلال ينبض + نوافذ مضيئة -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 170">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563EB"/><stop offset=".5" stop-color="#EF4444"/><stop offset="1" stop-color="#FACC15"/></linearGradient>
<linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF6C2"/><stop offset="1" stop-color="#FACC15"/></linearGradient>
<radialGradient id="gl"><stop offset="0" stop-color="#FACC15" stop-opacity=".55"/><stop offset="1" stop-color="#FACC15" stop-opacity="0"/></radialGradient></defs>
<style>
*{transform-box:fill-box}
.wv{fill:none;stroke:#EF4444;stroke-width:3;stroke-linecap:round;opacity:0;transform-origin:center;animation:wv 1.8s ease-out infinite}
.d2{animation-delay:.6s}.d3{animation-delay:1.2s}
@keyframes wv{0%{opacity:0;transform:scale(.5)}30%{opacity:.9}100%{opacity:0;transform:scale(1.4)}}
.st{fill:#FACC15;animation:tw 1.4s ease-in-out infinite}.s2{animation-delay:.5s}.s3{animation-delay:.9s}
@keyframes tw{50%{opacity:.15}}
.lit{animation:lt 1.6s ease-in-out infinite}
@keyframes lt{50%{opacity:.6}}
.cr{transform-origin:center;animation:cr 2s ease-in-out infinite}
@keyframes cr{50%{transform:scale(1.15) rotate(-6deg)}}
</style>
